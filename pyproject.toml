[project]
name = "ruling"
version = "0.1.0"
description = "A decision desk for refereeing calls: computed evidence, the Law, precedent, and checked explanations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-foundry>=1.15.0",
    "azure-identity>=1.26.0",
]

[project.scripts]
ruling-sim = "ruling.sim.cli:main"
ruling-eval = "ruling.eval.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruling"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
