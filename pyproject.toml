[project]
name = "ruling"
version = "0.1.0"
description = "A decision desk for refereeing calls: computed evidence, the Law, precedent, and checked explanations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-foundry>=1.15.0",
    "azure-cosmos>=4.17.1",
    "azure-eventhub>=5.15.1",
    "azure-identity>=1.26.0",
    "azure-monitor-opentelemetry>=1.8.11",
    "fastapi>=0.156.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ruling-sim = "ruling.sim.cli:main"
ruling-eval = "ruling.eval.run:main"
ruling-desk = "ruling.desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruling"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
